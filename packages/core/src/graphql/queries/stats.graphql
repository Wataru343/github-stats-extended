fragment RepoNode on Repository {
  name
  stargazerCount
}

fragment RepoStars on User {
  repositories(
    first: 100
    after: $after
    ownerAffiliations: $ownerAffiliations
    orderBy: { direction: DESC, field: STARGAZERS }
  ) {
    totalCount
    nodes {
      ...RepoNode
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query userRepos(
  $login: String!
  $after: String
  $ownerAffiliations: [RepositoryAffiliation]
) {
  user(login: $login) {
    ...RepoStars
  }
}

query userInfo(
  $login: String!
  $after: String
  $includeMergedPullRequests: Boolean!
  $includeDiscussions: Boolean!
  $includeDiscussionsAnswers: Boolean!
  $startTime: DateTime = null
  $ownerAffiliations: [RepositoryAffiliation]
  $includeUserRepositories: Boolean!
  $includeContributionStats: Boolean! = true
  $includePullRequestCount: Boolean! = true
  $includeContributionYears: Boolean! = true
) {
  user(login: $login) {
    name
    login
    commits: contributionsCollection(from: $startTime)
      @include(if: $includeContributionStats) {
      totalCommitContributions
    }
    reviews: contributionsCollection @include(if: $includeContributionStats) {
      totalPullRequestReviewContributions
    }
    repositoriesContributedTo(
      first: 1
      contributionTypes: [COMMIT, ISSUE, PULL_REQUEST, REPOSITORY]
      includeUserRepositories: $includeUserRepositories
    ) {
      totalCount
    }
    pullRequests(first: 1) @include(if: $includePullRequestCount) {
      totalCount
    }
    mergedPullRequests: pullRequests(states: MERGED)
      @include(if: $includeMergedPullRequests) {
      totalCount
    }
    openIssues: issues(states: OPEN) @include(if: $includeContributionStats) {
      totalCount
    }
    closedIssues: issues(states: CLOSED)
      @include(if: $includeContributionStats) {
      totalCount
    }
    followers {
      totalCount
    }
    repositoryDiscussions @include(if: $includeDiscussions) {
      totalCount
    }
    repositoryDiscussionComments(onlyAnswers: true)
      @include(if: $includeDiscussionsAnswers) {
      totalCount
    }
    contributionsCollection @include(if: $includeContributionYears) {
      contributionYears
    }
    ...RepoStars
  }
}

fragment YearContributions on ContributionsCollection {
  contributionCalendar {
    totalContributions
  }
}

fragment RangeContributionsByRepo on ContributionsCollection {
  commitContributionsByRepository(maxRepositories: $maxRepositories) {
    repository {
      nameWithOwner
    }
  }
  issueContributionsByRepository(maxRepositories: $maxRepositories) {
    repository {
      nameWithOwner
    }
  }
  pullRequestContributionsByRepository(maxRepositories: $maxRepositories) {
    repository {
      nameWithOwner
    }
  }
  repositoryContributions(first: $maxRepositories)
    @include(if: $includeOwnRepos) {
    nodes {
      repository {
        nameWithOwner
      }
    }
  }
}
